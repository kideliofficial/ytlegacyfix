services:
  - type: web
    name: ytlegacyfix-proxy
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: YTLF_PUBLIC_BASE
        fromService:
          type: web
          name: ytlegacyfix-proxy
          envVarKey: RENDER_EXTERNAL_URL
      - key: YTLF_LOG
        value: /dev/null
      - key: YTLF_SAVE_DIR
        value: ""
      - key: YTLF_UA
        value: "com.google.ios.youtube/21.26.4 (iPhone16,2; U; CPU iOS 18_3_2 like Mac OS X;)"
      - key: YTLF_DROP_HEADERS
        value: X-Goog-Device-Auth
      - key: YTLF_PB_DROP_MS
        value: "1"
      - key: YTLF_PB_VERSION
        value: 21.26.4
      - key: YTLF_PB_OSVER
        value: 18.3.2.22D82

  - type: web
    name: ytlegacyfix-cydia
    runtime: static
    rootDir: repo
    buildCommand: echo "Publishing checked-in Cydia repository files"
    staticPublishPath: .
